# Inside the server { } block of an HTTPS site. The desk serves relative URLs, so any prefix works
# as long as nginx strips it (the trailing slash on proxy_pass does that).
# Basic auth in front is optional: the desk has its own password, and basic auth keeps scanners off it.
location = /desk { return 301 /desk/; }
location /desk/ {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;
    proxy_pass http://127.0.0.1:3002/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
